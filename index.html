<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waterjet Calculator</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Waterjet Calculator</h1>

<div class="tabs">

<button class="tab active">
Cost Calculator
</button>

<button class="tab">
Production
</button>

</div>

<div class="card">

<h2>Warp</h2>

<input type="number" placeholder="Tar">

<input type="number" placeholder="Denier">

<input type="number" value="110">

<input type="number" placeholder="Rate">

</div>

<div class="card">

<h2>Weft</h2>

<input type="number" placeholder="Pick">

<input type="number" placeholder="Denier">

<input type="number" placeholder="Pano">

<input type="number" placeholder="Rate">

<input type="number" placeholder="Pick Charge">

</div>

<button class="calculate">

Calculate

</button>

<div class="result">

<h2>Result</h2>

<p>Warp Weight</p>

<p>Warp Cost</p>

<p>Weft Weight</p>

<p>Weft Cost</p>

<p>Total Weight</p>

<p>Yarn Cost</p>

<p>Net Rate</p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
